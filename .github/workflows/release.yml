# Push a tag like v1.0.0 and this builds every download and attaches it to a GitHub Release:
# the Android app, the helper's Windows .msi, Mac .pkg, and Linux .deb / .rpm / Arch packages.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.23"}
      - run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.0
      - run: VERSION=${GITHUB_REF_NAME#v} HOMEPAGE=https://github.com/${{ github.repository }} packaging/build-linux.sh
        if: startsWith(github.ref, 'refs/tags/')
      - run: packaging/build-linux.sh
        if: "!startsWith(github.ref, 'refs/tags/')"
      - uses: actions/upload-artifact@v4
        with: {name: linux, path: "dist/*.*"}

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.23"}
      - run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.Firewall.wixext/5.0.2 WixToolset.Util.wixext/5.0.2
      - shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF_NAME -like "v*") { $env:GITHUB_REF_NAME.Substring(1) } else { "1.0.0" }
          ./packaging/build-windows.ps1 -Version $v
      - uses: actions/upload-artifact@v4
        with: {name: windows, path: "dist/*.msi"}

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.23"}
      - run: |
          [[ $GITHUB_REF_NAME == v* ]] && export VERSION=${GITHUB_REF_NAME#v}
          packaging/build-macos.sh
      - uses: actions/upload-artifact@v4
        with: {name: macos, path: "dist/*.pkg"}

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0" "platforms;android-35" > /dev/null
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            mkdir -p ~/.android
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
      - env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: ANDROID_SDK=$ANDROID_HOME app/build.sh
      - uses: actions/upload-artifact@v4
        with: {name: android, path: "app/Issue Mortem.apk"}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows, macos, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {path: out, merge-multiple: true}
      - uses: softprops/action-gh-release@v2
        with: {files: "out/*"}
